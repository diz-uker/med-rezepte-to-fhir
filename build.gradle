// groovylint-disable NestedBlockDepth
plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.7.0'
    id 'io.freefair.lombok' version '9.5.0'
    id 'net.ltgt.errorprone' version '5.1.0'
}

group = 'io.github.diz-uker'
version = '0.1.19' // x-release-please-version
description = 'Med Rezepte to FHIR'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Isolated from sourceSets.main: ig-codegen (javapoet, jackson3, jspecify) is a build-time-only
// dev tool, not a runtime dependency of the app. See the generateConstants task below.
sourceSets {
    codegen {
        java.srcDirs = ['src/codegen/java']
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', '2025.1.2')
    set('hapiVersion', '8.10.0')
}

dependencies {
    implementation 'org.springframework.cloud:spring-cloud-stream'
    implementation 'org.springframework.cloud:spring-cloud-stream-binder-kafka'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'net.logstash.logback:logstash-logback-encoder:9.0'
    implementation 'org.miracum:kafka-fhir-serializer:3.0.0'
    implementation "ca.uhn.hapi.fhir:hapi-fhir-structures-r4:${hapiVersion}"
    implementation 'io.github.diz-uker:to-fhir-starter:0.2.6'
    implementation 'io.github.diz-uker:fhir-ig-constants:0.2.6'
    implementation 'com.github.slugify:slugify:4.0.0'

    codegenImplementation 'io.github.diz-uker:ig-codegen:0.2.6'

    testImplementation "ca.uhn.hapi.fhir:hapi-fhir-validation:${hapiVersion}"
    testImplementation "ca.uhn.hapi.fhir:hapi-fhir-validation-resources-r4:${hapiVersion}"
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.cloud:spring-cloud-stream-test-binder'
    testImplementation 'org.apache.kafka:kafka-streams-test-utils'
    testImplementation 'com.approvaltests:approvaltests:30.1.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    errorprone 'com.google.errorprone:error_prone_core:2.50.0'
    errorprone 'com.uber.nullaway:nullaway:0.13.7'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

spotless {
    java {
        target('**/*.java')
        importOrder()
        removeUnusedImports()
        googleJavaFormat()
    }
}

// via <https://stackoverflow.com/questions/24936781/gradle-plugin-project-version-number>
task printVersion {
    doLast {
        println project.version
    }
}

// Manually-invoked "generate, review, commit" dev tool - not a build-graph participant. The
// CodeSystem resources here are one-off local files, not restorable FHIR IG packages, so this
// uses ig-codegen's lower-level scanner/generator API directly instead of IgCodegen's
// package.json-driven entry point (see ig-codegen's README for that distinction).
tasks.register('generateConstants', JavaExec) {
    group = 'codegen'
    description = 'Regenerates Java constant classes in src/main/java from CodeSystem JSON files ' +
        'in src/main/resources (EDQM Standard Terms, KBV Darreichungsform). Review the diff and commit.'
    classpath = sourceSets.codegen.runtimeClasspath
    mainClass = 'io.github.dizuker.medrezeptetofhir.codegen.GenerateConstants'
    args = [
        layout.projectDirectory.dir('src/main/resources').asFile.path,
        layout.projectDirectory.dir('src/main/java').asFile.path,
    ]
    finalizedBy 'spotlessApply'
}

jacoco {
    toolVersion = '0.8.15'
}

jacocoTestReport {
    reports {
        csv.required = true
        html.required = true
        xml.required = true
    }
}

import net.ltgt.gradle.errorprone.CheckSeverity

tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        check('NullAway', CheckSeverity.WARN)
        option('NullAway:AnnotatedPackages', 'io.github.diz-uker.medrezeptetofhir')
    }
    options.errorprone.disableWarningsInGeneratedCode = true
    // ignore legacy mappers code
}
